# The same command as local development, in the same pinned toolchain. This is
# deliberately not a second recipe with node and Playwright installed by hand:
# a CI that defines "correct" differently from the local shell is a CI that
# drifts.
#
# Baselines are per-engine on purpose (tests/golden/<engine>/): engines disagree
# about sub-pixel text layout, and a cross-engine "diff" of that is noise rather
# than evidence. This job therefore pins the engine as well as the toolchain, and
# the baselines it compares against were painted by that same engine.
#
# Reproducibility caveat, stated rather than implied: this repo has no committed
# flake.lock, so `nix develop` re-resolves nixpkgs and CI may run a newer node or
# Playwright than the machine the baselines came from. If goldens fail here while
# passing locally, that difference is the first thing to suspect -- regenerate the
# lock (nix flake lock) and commit it to close the gap.
name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      # fetch-depth 0: the artifact is a build product committed next to its
      # sources, and full history lets a later "does the committed artifact match
      # a rebuild" step see the commit that produced it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pinned to a released tag: an unpinned installer could change how nix
      # resolves the lock between runs.
      - uses: cachix/install-nix-action@v31.11.3
        with:
          # Temporary workaround for a transient cache.nixos.org failure that made
          # run 4 red while `nix build` had already passed. Nix's HTTP/2 transport
          # drops a NAR download mid-transfer ("curl error: Failed sending data to
          # the peer"); the range-resume retry then gets HTTP 416, which nix treats
          # as fatal rather than retrying whole-file. With fallback = false, "no
          # substituter can build it" ends the job. Two independent reports:
          # https://github.com/NixOS/infra/issues/1106 and
          # https://github.com/DeterminateSystems/nix-src/issues/750 (backport of
          # NixOS/nix#16722).
          #
          # Retirement condition: drop `http2 = false` once the nix on the runner
          # carries the fix, and verify with a run that materialises the dev shell
          # (it is the heaviest download in this job).
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            http2 = false
            fallback = true

      # packages.default is the shipped artifact, so a broken package build has to
      # be a red build. Nothing else would catch it: the checklist runs `nix
      # develop`, which does not build the package at all.
      - name: Build the package and check it matches the committed artifact
        run: |
          # Addressed by store path rather than a result symlink: --no-link
          # creates no symlink, so the obvious `result/index.html` is a missing
          # file, and that reads as a build error rather than a wrong path.
          OUT=$(nix build --no-link --print-out-paths)
          sha256sum "$OUT/index.html" index.html
          test "$(sha256sum < "$OUT/index.html")" = "$(sha256sum < index.html)"

      - name: Run the acceptance checklist
        run: |
          # Echoed so a failure log can be triaged without guessing: if this says
          # fallback=false while the job died on a substituter error, the
          # workaround above did not reach the nix doing the download.
          nix show-config | grep -E '^(fallback|http2) '
          if ! nix develop --command ./check.sh --engine firefox; then
            echo "::error::checklist failed. If the log shows 'HTTP error 416' or 'no substituter that can build it', this is the transient cache.nixos.org failure, not the app -- rerun the job."
            exit 1
          fi

      # On failure, the frames CI saw are the difference between "the layout
      # moved" and "this runner's fonts differ", so keep them.
      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-output
          path: .tmp/
